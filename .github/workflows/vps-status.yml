# Read-only health report for the production VPS, runnable from the Actions
# tab without RDP.
#
# Why this exists: on 2026-09-05 the box wedged and RDP was the only way in,
# and on 2026-09-14 the API was down while the watchdog that should have
# restarted it stayed silent. Both times the question was the same, "what does
# the box actually think is going on", and both times answering it meant a
# remote desktop session.
#
# The report itself lives in scripts/vps-diagnostics.ps1 so it can be read,
# reviewed and run by hand on the box. This workflow only invokes it. Keeping
# the logic out of an inline one-liner also keeps it clear of cmd.exe's 8191
# character command-line limit, which the old inline version was approaching.
#
# Deliberately takes NO inputs and runs a FIXED script. A workflow that accepts
# an arbitrary command would be remote code execution on production for anyone
# with write access to this repo, which is a far worse trade than the
# convenience is worth. Add a new section to the diagnostics script instead.
#
# Nothing here mutates the box. To actually restart something, run the deploy
# workflow, which is the reviewed path.

name: VPS status

on:
  workflow_dispatch:

concurrency:
  group: vps-status
  cancel-in-progress: false

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Collect status over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 5m
          # Falls back to a minimal inline check when the script is not on the
          # box yet, e.g. right after this change merges and before a deploy
          # has landed it, so the workflow never goes completely blind.
          script: |
            powershell -NoProfile -ExecutionPolicy Bypass -Command "$f='C:\app\goal-slot-api\scripts\vps-diagnostics.ps1'; if (Test-Path $f) { & $f } else { Write-Host 'vps-diagnostics.ps1 not on the box yet; run the deploy workflow. Minimal fallback follows.'; $o=Get-CimInstance Win32_OperatingSystem; Write-Host ('booted ' + $o.LastBootUpTime + ' mem_used_pct ' + [int]((1-$o.FreePhysicalMemory/$o.TotalVisibleMemorySize)*100)); Get-Service caddy,goal-slot-api,jiffy-messaging | ForEach-Object { Write-Host ($_.Name + ' ' + $_.Status) } }"
